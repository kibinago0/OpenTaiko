name: Repomix - Source Code Only

on:
  workflow_dispatch:

jobs:
  repomix:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Repomix
        run: |
          npx repomix@1.18.0 \
            --style markdown \
            --remove-empty-lines \
            --output-show-line-numbers \
            --include "**/*.cs,**/*.csproj,**/*.sln,**/*.lua,**/*.h,**/*.hpp,**/*.c,**/*.cpp,**/*.cc,**/*.inl,**/*.ixx,**/*.shader,**/*.hlsl,**/*.glsl,**/*.vert,**/*.frag"

      - name: Upload Repomix output
        uses: actions/upload-artifact@v4
        with:
          name: OpenTaiko-Source-Code
          path: repomix-output.md
          if-no-files-found: error
