name: Repomix - Source Code to Google Drive

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repomix:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout OpenTaiko
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Repomix
        run: |
          npx repomix@1.18.0 \
            --style markdown \
            --remove-empty-lines \
            --output-show-line-numbers \
            --include "**/*.cs,**/*.csproj,**/*.sln,**/*.lua,**/*.h,**/*.hpp,**/*.c,**/*.cpp,**/*.cc,**/*.inl,**/*.ixx,**/*.shader,**/*.hlsl,**/*.glsl,**/*.vert,**/*.frag"

      - name: Install Google Drive uploader
        run: |
          python -m pip install --upgrade pip
          pip install google-api-python-client google-auth google-auth-httplib2

      - name: Upload to Google Drive
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
        run: |
          python <<'PY'
          import os
          import json
          from google.oauth2 import service_account
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload

          credentials = service_account.Credentials.from_service_account_info(
              json.loads(os.environ["GOOGLE_SERVICE_ACCOUNT_JSON"]),
              scopes=["https://www.googleapis.com/auth/drive.file"]
          )

          service = build(
              "drive",
              "v3",
              credentials=credentials
          )

          folder_id = os.environ["GOOGLE_DRIVE_FOLDER_ID"]

          file_name = "OpenTaiko-repomix.md"

          query = (
              f"'{folder_id}' in parents "
              "and name = 'OpenTaiko-repomix.md' "
              "and trashed = false"
          )

          result = service.files().list(
              q=query,
              spaces="drive",
              fields="files(id,name)"
          ).execute()

          media = MediaFileUpload(
              "repomix-output.md",
              mimetype="text/markdown",
              resumable=True
          )

          if result["files"]:
              file_id = result["files"][0]["id"]

              service.files().update(
                  fileId=file_id,
                  media_body=media
              ).execute()

              print("Updated existing Google Drive file.")

          else:
              metadata = {
                  "name": file_name,
                  "parents": [folder_id]
              }

              service.files().create(
                  body=metadata,
                  media_body=media,
                  fields="id,name"
              ).execute()

              print("Created new Google Drive file.")
          PY

      - name: Upload GitHub Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenTaiko-Source-Code-Repomix
          path: repomix-output.md
          if-no-files-found: error
